<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="blindgrid">
  <title>blindgrid</title>
  <defs>
    <linearGradient id="drawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7cf6"/>
      <stop offset="100%" stop-color="#4c8dff"/>
    </linearGradient>
  </defs>

  <!-- Unmarked cells. A mid grey at partial opacity stays legible on both the
       light and the dark GitHub theme without needing two files. -->
  <g fill="#8b949e" fill-opacity="0.32">
    <rect x="5" y="5" width="18" height="18" rx="5"/>
    <rect x="55" y="5" width="18" height="18" rx="5"/>
    <rect x="105" y="5" width="18" height="18" rx="5"/>
    <rect x="30" y="30" width="18" height="18" rx="5"/>
    <rect x="55" y="30" width="18" height="18" rx="5"/>
    <rect x="80" y="30" width="18" height="18" rx="5"/>
    <rect x="105" y="30" width="18" height="18" rx="5"/>
    <rect x="5" y="55" width="18" height="18" rx="5"/>
    <rect x="30" y="55" width="18" height="18" rx="5"/>
    <rect x="80" y="55" width="18" height="18" rx="5"/>
    <rect x="105" y="55" width="18" height="18" rx="5"/>
    <rect x="5" y="80" width="18" height="18" rx="5"/>
    <rect x="30" y="80" width="18" height="18" rx="5"/>
    <rect x="55" y="80" width="18" height="18" rx="5"/>
    <rect x="80" y="80" width="18" height="18" rx="5"/>
    <rect x="5" y="105" width="18" height="18" rx="5"/>
    <rect x="55" y="105" width="18" height="18" rx="5"/>
    <rect x="80" y="105" width="18" height="18" rx="5"/>
    <rect x="105" y="105" width="18" height="18" rx="5"/>
  </g>

  <!-- Drawn cells. Deliberately off-pattern: no row, column or diagonal
       carries them, because a logo that reads as a sequence would be selling
       the opposite of what this tool does. -->
  <g fill="url(#drawn)">
    <rect x="30" y="5" width="18" height="18" rx="5"/>
    <rect x="80" y="5" width="18" height="18" rx="5"/>
    <rect x="5" y="30" width="18" height="18" rx="5"/>
    <rect x="55" y="55" width="18" height="18" rx="5"/>
    <rect x="105" y="80" width="18" height="18" rx="5"/>
    <rect x="30" y="105" width="18" height="18" rx="5"/>
  </g>
</svg>
