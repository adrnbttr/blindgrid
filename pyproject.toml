[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blindgrid"
version = "0.2.0"
description = "Generate lottery grids from cryptographic randomness and plan a month within a hard budget cap."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Adrien Bouttier", email = "adrnbttr@gmail.com" }]
keywords = ["lottery", "cli", "csprng", "budget", "randomness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/adrnbttr/blindgrid"
Repository = "https://github.com/adrnbttr/blindgrid"
Issues = "https://github.com/adrnbttr/blindgrid/issues"

[project.scripts]
blindgrid = "blindgrid.cli:app"

# The demo recording is a megabyte of README decoration; nobody installing the
# package needs it, and it would dominate the download.
[tool.hatch.build.targets.sdist]
exclude = ["/docs/demo.gif", "/docs/demo.tape", "/.github", "/uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/blindgrid"]

# The example config lives at the repository root, where someone browsing the
# project expects it, and is shipped inside the wheel so `config init` works
# from an installed copy.
[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "blindgrid/data/config.example.toml"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "PL"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
# A Typer command's parameters are its command-line options: they are the
# public interface, and grouping them into an object would hide it.
max-args = 10
max-positional-args = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/blindgrid"]
