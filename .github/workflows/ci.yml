name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows consoles still default to a legacy code page, and the tables are
  # drawn with box characters.
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11", name: "Linux · 3.11" }
          - { os: ubuntu-latest, python-version: "3.12", name: "Linux · 3.12" }
          - { os: ubuntu-latest, python-version: "3.13", name: "Linux · 3.13" }
          - { os: macos-latest, python-version: "3.13", name: "macOS · 3.13" }
          - { os: windows-latest, python-version: "3.11", name: "Windows · 3.11" }
          - { os: windows-latest, python-version: "3.13", name: "Windows · 3.13" }

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the package
        run: uv venv --python ${{ matrix.python-version }} && uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      - name: The command runs end to end
        run: |
          uv run blindgrid version
          uv run blindgrid config init --config bg.toml
          uv run blindgrid --help
        env:
          BLINDGRID_CONFIG: bg.toml

  installer-unix:
    name: Installer · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      # Linting the script is platform-independent, and shellcheck is not
      # preinstalled on the macOS runners.
      - name: Lint the script
        if: runner.os == 'Linux'
        run: shellcheck install.sh

      # The installer is the first thing most people run, and its fallback path
      # touches PATH, virtualenvs and the config directory. Exercise it for
      # real rather than trusting that it still works. macOS matters here in
      # its own right: it ships bash 3.2 and the BSD flavour of sed.
      - name: Install from this checkout
        run: bash install.sh --method venv --source .

      - name: The installed command runs
        run: |
          "$HOME/.local/bin/blindgrid" version
          "$HOME/.local/bin/blindgrid" generate -b 20 -l Loto -m 2026-09 --no-export

      - name: Uninstall cleanly
        run: |
          bash install.sh --uninstall
          test ! -e "$HOME/.local/bin/blindgrid"
          test -f "$HOME/.config/blindgrid/config.toml"  # config is kept on purpose

  # The Python installer is the way in on iOS, where there is no bash and no
  # git. Nothing here can run on an iPad, so it is exercised on the closest
  # thing available: a bare interpreter, installing from a source archive.
  installer-python:
    name: Installer · python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint the script
        run: pipx run ruff check install.py

      - name: Install from this checkout
        run: python install.py --source .

      - name: The module entry point runs
        run: |
          python -m blindgrid version
          python -m blindgrid generate -b 20 -l Loto -m 2026-09 --no-export

      # Overflow is covered by the test suite at six widths; what this adds
      # is the real installed command on a real narrow terminal. Truncation is
      # the tell that the layout gave up rather than adapted.
      - name: Nothing is truncated when narrow
        run: |
          for width in 40 55 70; do
            echo "--- $width columns ---"
            COLUMNS=$width python -m blindgrid generate \
              -b 20 -l Loto -m 2026-09 --no-export --force | tee /tmp/out.txt
            if grep -q '…' /tmp/out.txt; then
              echo "::error::something was truncated at $width columns"
              exit 1
            fi
          done

      - name: Without a terminal, prompts explain themselves
        run: |
          set +e
          # A month the earlier steps have not drawn, so a prompt is reached.
          output=$(python -m blindgrid generate -m 2026-11 --no-export < /dev/null 2>&1)
          echo "$output"
          echo "$output" | grep -q "interactive terminal" || {
            echo "::error::expected a readable message, not a traceback"; exit 1; }

  installer-windows:
    name: Installer · windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Lint the script
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # PSAvoidUsingWriteHost is aimed at reusable modules, whose output
          # should stay pipeable. This is an installer whose entire job is to
          # talk to the person running it, so writing to the host is the point.
          $found = Invoke-ScriptAnalyzer -Path install.ps1 `
            -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          if ($found) { $found | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host 'PSScriptAnalyzer: clean'

      - name: Install from this checkout
        shell: pwsh
        run: .\install.ps1 -Method Venv -Source .

      - name: The installed command runs
        shell: pwsh
        run: |
          $shim = Join-Path $env:LOCALAPPDATA 'Programs\blindgrid\blindgrid.cmd'
          & $shim version
          & $shim generate -b 20 -l Loto -m 2026-09 --no-export
          if ($LASTEXITCODE -ne 0) { throw 'generate failed' }

      - name: Uninstall cleanly
        shell: pwsh
        run: |
          .\install.ps1 -Uninstall
          $shim = Join-Path $env:LOCALAPPDATA 'Programs\blindgrid\blindgrid.cmd'
          if (Test-Path $shim) { throw 'the shim survived the uninstall' }
          $config = Join-Path $env:APPDATA 'blindgrid\config.toml'
          if (-not (Test-Path $config)) { throw 'the configuration was deleted' }
